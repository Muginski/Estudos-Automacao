# Esteira CI — Estudos Automacao (didática)
# Conceito do áudio 11:56 — cada repo tem sua esteira, com estágios configuráveis.
# Aqui simulamos 3 estágios: dev (push) -> homolog (PR) -> prod (main) + gate.
# Gate = merge bloqueado se job falha (branch protection no GitHub).

name: esteira

on:
  push:
    branches: [master, main, dev] # dev = estágio 1, master/main = prod
  pull_request:
    branches: [master, main] # PR = homolog -> testa antes do merge pra prod

jobs:
  # Job 1: API — roda mvn test (RestAssured). Roda em todo push/PR.
  api:
    name: api (RestAssured)
    runs-on: ubuntu-latest
    # Se não tem SUT real, pode mockar: aqui só valida compilação se baseUrl não responder
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # Tenta rodar contra localhost:3000; se SUT não existe, job falha -> gate bloqueia merge (didático)
      - name: Run API tests
        working-directory: api-restassured
        run: mvn -B test -DbaseUrl=http://localhost:3000 -DbasePath=/api
        # Para não quebrar sem SUT real durante estudo, descomente a linha abaixo e comente a de cima:
        # run: mvn -B test-compile # só compila, não falha sem SUT

  # Job 2: Front — Cypress (Page Object). Também roda em push/PR.
  front:
    name: front (Cypress)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: front-cypress/package.json

      - name: Install deps
        working-directory: front-cypress
        run: npm ci

      # Headless — precisa SUT em localhost:3000 ou mock; sem SUT, também bloqueia (gate)
      - name: Run Cypress
        working-directory: front-cypress
        run: npm run cy:run
        # Sem SUT real, use: run: npx cypress verify

  # Job 3: Gate — só passa se api + front passarem. Protege a main.
  # No GitHub: Settings -> Branches -> Add rule -> Require status checks -> esteira / gate
  gate:
    name: gate (bloqueia merge se falhar)
    runs-on: ubuntu-latest
    needs: [api, front] # depende dos dois estágios de teste
    if: always() # sempre avalia
    steps:
      - name: Verifica se ambos passaram
        run: |
          if [ "${{ needs.api.result }}" != "success" ] || [ "${{ needs.front.result }}" != "success" ]; then
            echo "❌ Gate bloqueado: api=${{ needs.api.result }} front=${{ needs.front.result }}"
            exit 1
          fi
          echo "✅ Gate liberado: bateria passou, merge pode prosseguir"
